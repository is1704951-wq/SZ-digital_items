<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #fff;
            flex-direction: column;
        }

        #main-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #000 70%, #000 100%);
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background-color: #c84c0c;
            border-top: 8px solid #00a800;
        }

        .content {
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
            color: #fbd000;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>This is a clean layout template!</p>
        </div>
        <div id="ground"></div>
    </div>

</body>
</html>
